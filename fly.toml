# fly.toml app configuration file generated for personalmovie on 2026-09-20T23:58:39+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'personalmovie'
primary_region = 'fra'

[build]

[env]
  # Umami website ID for analytics — not sensitive (visible in page source anyway),
  # so it lives here as a plain env var rather than a Fly secret.
  UMAMI_WEBSITE_ID = '91893401-a437-4a90-926a-9e86776dfa22'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Each Streamlit session holds a live WebSocket connection + its own in-memory
  # state (uploaded ratings, recommendation results). Past ~20 concurrent
  # sessions on a shared-cpu-1x/1GB machine, Fly should spin up another machine
  # rather than let this one machine get overloaded and slow down for everyone.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
